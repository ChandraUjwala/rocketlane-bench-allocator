name: Daily Bench Allocator

on:
  schedule:
    # Runs daily at 11:00 PM UTC
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI for testing

jobs:
  run-bench-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Bench Allocation Script
        env:
          ROCKETLANE_API_KEY: ${{ secrets.ROCKETLANE_API_KEY }}
          RMG_PROJECT_ID: ${{ secrets.RMG_PROJECT_ID }}
        run: python script.py
